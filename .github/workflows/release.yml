name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing stable tag whose publication should be completed
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Empty when the commits since the last tag do not warrant a release.
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.recover.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.recover.outputs.version }}
      package_tag: ${{ steps.package.outputs.package_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install the Claude package test engine
        run: npm install -g @anthropic-ai/claude-code@2.1.321
      - name: Release
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx --yes \
          -p semantic-release@25.0.9 \
          -p @semantic-release/commit-analyzer@13.0.1 \
          -p @semantic-release/release-notes-generator@14.1.1 \
          -p @semantic-release/changelog@7.0.0 \
          -p @semantic-release/exec@7.1.0 \
          -p @semantic-release/git@11.0.1 \
          -p @semantic-release/github@12.0.10 \
          -p conventional-changelog-conventionalcommits@9.3.1 \
          semantic-release 2>&1 | tee "$RUNNER_TEMP/window-todo-release.log"
      - name: Recover a post-tag Git notes push failure
        id: recover
        if: ${{ !cancelled() && steps.release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/recover-release.js --notes-failure-log "$RUNNER_TEMP/window-todo-release.log"
      # Builds the released tag again from its own sources and commits only the package to the release branch.
      - name: Publish the package branch
        id: package
        if: ${{ steps.release.outputs.tag != '' || steps.recover.outputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag || steps.recover.outputs.tag }}
        run: node scripts/publish-package.js "$RELEASE_TAG"

  recovery:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.recover.outputs.tag }}
      version: ${{ steps.recover.outputs.version }}
      package_tag: ${{ steps.package.outputs.package_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install the Claude package test engine
        run: npm install -g @anthropic-ai/claude-code@2.1.321
      - name: Complete publication of the existing tag
        id: recover
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/recover-release.js
      - name: Publish the package branch
        id: package
        env:
          RELEASE_TAG: ${{ steps.recover.outputs.tag }}
        run: node scripts/publish-package.js "$RELEASE_TAG"

  # Points the catalogue entry in github.com/mrtaler/agent-plugins at the new package tag through a
  # pull request opened by the mrtaler-release-bot GitHub App: the built-in GITHUB_TOKEN cannot write
  # to another repository, and a pull request it opened would not trigger the catalogue's checks.
  catalogue:
    needs: [release, recovery]
    if: ${{ always() && (needs.release.outputs.package_tag != '' || needs.recovery.outputs.package_tag != '') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mrtaler
          repositories: agent-plugins
      - uses: actions/checkout@v7
        with:
          repository: mrtaler/agent-plugins
          token: ${{ steps.app-token.outputs.token }}
      - name: Point the catalogue at the package tag
        env:
          PACKAGE_TAG: ${{ needs.release.outputs.package_tag || needs.recovery.outputs.package_tag }}
        run: |
          for catalogue in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            [ -f "$catalogue" ] || continue
            jq --arg ref "$PACKAGE_TAG" \
              '(.plugins[] | select(.name == "window-todo") | .source) |= (if type == "object" then del(.sha) + {ref: $ref} else . end)' \
              "$catalogue" > "$catalogue.tmp"
            mv "$catalogue.tmp" "$catalogue"
          done
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/window-todo
          delete-branch: true
          sign-commits: true
          commit-message: "feat: window-todo ${{ needs.release.outputs.version || needs.recovery.outputs.version }}"
          title: "feat: window-todo ${{ needs.release.outputs.version || needs.recovery.outputs.version }} (${{ needs.release.outputs.package_tag || needs.recovery.outputs.package_tag }})"
          body: "Points window-todo at package tag ${{ needs.release.outputs.package_tag || needs.recovery.outputs.package_tag }}: the built package of release ${{ needs.release.outputs.tag || needs.recovery.outputs.tag }}, published on the release branch of mrtaler/window-todo."
