name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing stable tag whose publication should be completed
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Empty when the commits since the last tag do not warrant a release.
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.recover.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.recover.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Release
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx --yes \
          -p semantic-release@25.0.9 \
          -p @semantic-release/commit-analyzer@13.0.1 \
          -p @semantic-release/release-notes-generator@14.1.1 \
          -p @semantic-release/changelog@7.0.0 \
          -p @semantic-release/exec@7.1.0 \
          -p @semantic-release/git@11.0.1 \
          -p @semantic-release/github@12.0.10 \
          -p conventional-changelog-conventionalcommits@9.3.1 \
          semantic-release 2>&1 | tee "$RUNNER_TEMP/window-todo-release.log"
      - name: Recover a post-tag Git notes push failure
        id: recover
        if: ${{ !cancelled() && steps.release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/recover-release.js --notes-failure-log "$RUNNER_TEMP/window-todo-release.log"

  recovery:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.recover.outputs.tag }}
      version: ${{ steps.recover.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Complete publication of the existing tag
        id: recover
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/recover-release.js

  # Moves both catalogue entries in github.com/mrtaler/agent-plugins to the new release through a
  # pull request opened by the mrtaler-release-bot GitHub App: Claude installs the release tag from
  # sources, Codex installs the npm-format release asset through the catalogue's static registry.
  # The built-in GITHUB_TOKEN cannot write to another repository, and a pull request it opened would
  # not trigger the catalogue's checks.
  catalogue:
    needs: [release, recovery]
    if: ${{ always() && (needs.release.outputs.tag != '' || needs.recovery.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAG: ${{ needs.release.outputs.tag || needs.recovery.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version || needs.recovery.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mrtaler
          repositories: agent-plugins
      - uses: actions/checkout@v7
        with:
          repository: mrtaler/agent-plugins
          token: ${{ steps.app-token.outputs.token }}
      - name: Point the catalogue at the release
        run: |
          set -euo pipefail
          tarball="https://github.com/mrtaler/window-todo/releases/download/${TAG}/window-todo-${VERSION}.tgz"
          archive="$RUNNER_TEMP/window-todo-${VERSION}.tgz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" "$tarball"
          integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w0)"
          jq --arg ref "$TAG" \
            '(.plugins[] | select(.name == "window-todo") | .source) = {source: "url", url: "https://github.com/mrtaler/window-todo.git", ref: $ref}' \
            .claude-plugin/marketplace.json > "$RUNNER_TEMP/claude.json"
          mv "$RUNNER_TEMP/claude.json" .claude-plugin/marketplace.json
          jq --arg version "$VERSION" \
            '(.plugins[] | select(.name == "window-todo") | .source) = {source: "npm", package: "window-todo", version: $version, registry: "https://raw.githubusercontent.com/mrtaler/agent-plugins/master/registry"}' \
            .agents/plugins/marketplace.json > "$RUNNER_TEMP/codex.json"
          mv "$RUNNER_TEMP/codex.json" .agents/plugins/marketplace.json
          mkdir -p registry
          [ -f registry/window-todo ] || echo '{"name":"window-todo","dist-tags":{},"versions":{}}' > registry/window-todo
          jq --arg version "$VERSION" --arg tarball "$tarball" --arg integrity "$integrity" \
            '.versions[$version] = {name: "window-todo", version: $version, dist: {tarball: $tarball, integrity: $integrity}} | .["dist-tags"].latest = $version' \
            registry/window-todo > "$RUNNER_TEMP/registry.json"
          mv "$RUNNER_TEMP/registry.json" registry/window-todo
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/window-todo
          delete-branch: true
          sign-commits: true
          commit-message: "feat: window-todo ${{ env.VERSION }}"
          title: "feat: window-todo ${{ env.VERSION }}"
          body: "Moves the Claude entry of window-todo to tag ${{ env.TAG }}, installed from sources. Codex installs ${{ env.VERSION }} from the release asset window-todo-${{ env.VERSION }}.tgz through registry/window-todo."
