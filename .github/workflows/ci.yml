name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject a tracked generated runtime
        run: |
          tracked="$(git ls-files dist)"
          if [ -n "$tracked" ]; then
            echo "dist/ is generated and published to the release branch; stop tracking it:"
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install the Claude test engine
        run: npm install -g @anthropic-ai/claude-code@2.1.321
      - run: npm run check
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: window-todo-package
          path: artifacts/window-todo-*.tar.gz
          if-no-files-found: error
