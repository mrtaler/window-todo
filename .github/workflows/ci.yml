name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject generated runtime changes in source PRs
        if: github.event_name == 'pull_request'
        run: git diff --exit-code origin/master...HEAD -- dist
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install the Claude test engine
        run: npm install -g @anthropic-ai/claude-code@2.1.321
      - run: npm run check
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: window-todo-package
          path: artifacts/window-todo-*.tar.gz
          if-no-files-found: error
